name: Bug report
description: Report reproducible incorrect behavior in Codex Insights.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach raw Codex sessions, credentials, prompts, or other private
        data. Use a minimal synthetic example.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit, or output of the installation method used.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version, and Codex CLI version if relevant.
      placeholder: macOS 15, arm64, Go 1.27.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, synthetic reproduction.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Remove prompts, answers, paths, credentials, and personal data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private session data, credentials, tokens, and absolute local paths.
          required: true
